name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # No logo in home-assistant/brands yet; remove once the brands PR lands.
          ignore: brands

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Not an editable install: the editable path hook breaks HA's
      # custom_components discovery in tests.
      - run: uv venv --python 3.13 && uv pip install pytest-homeassistant-custom-component ruff
      - run: uv run pytest
      - run: uv run ruff check custom_components tests
